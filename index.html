<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>INDIA MAP PRO - By Ranjeet Singh</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background-color: #060a12;
    color: #f8fafc;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 👑 TOP VIP CREATOR BANNER 👑 */
  .creator-top-banner {
    background: linear-gradient(90deg, #b45309, #fbbf24, #b45309);
    color: #000;
    text-align: center;
    padding: 6px 10px;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 50;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid #fef08a;
  }
  .creator-top-banner span {
    background: #060a12;
    color: #fbbf24;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1px;
  }

  /* Header Panel */
  .header-panel {
    background: #0f172a;
    padding: 8px 12px;
    border-bottom: 1px solid #1e293b;
    z-index: 20;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .title-area {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .game-title {
    font-size: 15px;
    font-weight: 900;
    color: #38bdf8;
    letter-spacing: 0.5px;
  }
  .sound-btn {
    background: #1e293b;
    border: 1px solid #38bdf8;
    color: #f8fafc;
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }
  .stats-row {
    display: flex;
    gap: 5px;
  }
  .stat-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 2px 8px;
    text-align: center;
    min-width: 58px;
  }
  .stat-label {
    font-size: 8px;
    color: #94a3b8;
    text-transform: uppercase;
  }
  .stat-val {
    font-size: 13px;
    font-weight: 800;
    color: #4ade80;
  }
  .streak-val {
    color: #fb923c;
  }

  /* Target Box with Hint & Skip Buttons */
  .target-box {
    background: #172554;
    border: 1.5px solid #38bdf8;
    border-radius: 10px;
    padding: 7px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .target-info {
    flex: 1;
    min-width: 0;
  }
  .target-sub {
    font-size: 9px;
    color: #93c5fd;
    text-transform: uppercase;
    font-weight: 700;
  }
  .target-state {
    font-size: 17px;
    font-weight: 900;
    color: #fbbf24;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .btn-group {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .hint-btn {
    background: #f59e0b;
    border: 1px solid #fde047;
    color: #000;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }
  .skip-btn {
    background: #1e3a8a;
    border: 1px solid #60a5fa;
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .hint-btn:active, .skip-btn:active, .sound-btn:active {
    transform: scale(0.94);
  }

  /* Map Container - Pure GPU Layer */
  .map-wrapper {
    flex: 1;
    position: relative;
    background: #060a12;
    overflow: hidden;
    touch-action: none;
  }
  #map-canvas {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-origin: 0 0;
    will-change: transform;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  svg {
    width: 98%;
    height: 98%;
    shape-rendering: optimizeSpeed;
  }
  /* Crisp & Fast State Boundaries */
  svg path {
    fill: #1e293b;
    stroke: #cbd5e1;
    stroke-width: 0.45px;
    stroke-linejoin: round;
    cursor: pointer;
  }
  svg path.correct {
    fill: #16a34a !important;
    stroke: #ffffff !important;
    stroke-width: 0.6px !important;
    pointer-events: none;
  }
  svg path.wrong {
    fill: #dc2626 !important;
  }
  /* 💡 HINT HIGHLIGHT EFFECT 💡 */
  svg path.hint-glow {
    fill: #facc15 !important;
    stroke: #ffffff !important;
    stroke-width: 1px !important;
  }

  /* Small UT Dots */
  svg circle.ut-dot {
    fill: #38bdf8;
    stroke: #ffffff;
    stroke-width: 0.8px;
    cursor: pointer;
  }
  svg circle.ut-dot.correct {
    fill: #22c55e !important;
    stroke: #ffffff !important;
    pointer-events: none;
  }
  svg circle.ut-dot.wrong {
    fill: #ef4444 !important;
  }
  svg circle.ut-dot.hint-glow {
    fill: #facc15 !important;
    stroke: #ff0000 !important;
    stroke-width: 1.5px !important;
    r: 7.5px !important;
  }

  /* Floating Score Popup */
  .pop-score {
    position: absolute;
    font-weight: 900;
    font-size: 18px;
    pointer-events: none;
    z-index: 40;
    animation: floatUp 0.75s ease-out forwards;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
    50% { transform: translate(-50%, -22px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -40px) scale(1); }
  }

  /* Confetti Canvas */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 35;
  }

  /* Bottom Watermark */
  .bottom-watermark {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: #0f172a;
    border: 1.5px solid #fbbf24;
    color: #fbbf24;
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 800;
    pointer-events: none;
    z-index: 15;
  }

  /* Zoom Controls */
  .zoom-controls {
    position: absolute;
    bottom: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 15;
  }
  .z-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: #1e293b;
    border: 1px solid #475569;
    color: #f8fafc;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .z-btn:active {
    background: #38bdf8;
    color: #000;
  }

  /* Toast Notification */
  #toast {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: #0f172a;
    border: 1.5px solid #38bdf8;
    color: #fff;
    padding: 6px 14px;
    border-radius: 18px;
    font-size: 12px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s;
    z-index: 30;
    white-space: nowrap;
  }

  /* Win Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 10, 18, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
    text-align: center;
  }
  .win-card {
    background: #1e293b;
    border: 2px solid #fbbf24;
    border-radius: 20px;
    padding: 24px 20px;
    max-width: 330px;
    width: 100%;
  }
  .win-title {
    font-size: 24px;
    font-weight: 900;
    color: #fbbf24;
    margin-bottom: 8px;
  }
  .win-score {
    font-size: 16px;
    color: #e2e8f0;
    margin-bottom: 14px;
  }
  .win-creator {
    background: #0f172a;
    border: 1px solid #fbbf24;
    color: #fde047;
    padding: 8px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 16px;
  }
  .action-btn {
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .btn-play { background: #38bdf8; color: #000; }
  .btn-share { background: #22c55e; color: #fff; }
</style>
</head>
<body>

  <!-- 👑 SABSE UPAR AAPKA NAAM 👑 -->
  <div class="creator-top-banner">
    👑 CREATED BY: <span>RANJEET SINGH</span>
  </div>

  <!-- Header -->
  <div class="header-panel">
    <div class="top-row">
      <div class="title-area">
        <div class="game-title">🇮🇳 INDIA MAP PRO</div>
        <button class="sound-btn" id="sound-toggle" onclick="toggleAudio()">🔊 Music</button>
      </div>
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Streak</div>
          <div class="stat-val streak-val" id="streak-val">🔥0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Found</div>
          <div class="stat-val" id="found-val">0/36</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Score</div>
          <div class="stat-val" id="score-val">0</div>
        </div>
      </div>
    </div>

    <div class="target-box">
      <div class="target-info">
        <div class="target-sub">🗺️ TAP ON THIS STATE / UT:</div>
        <div class="target-state" id="target-name">Loading Fast Map...</div>
      </div>
      <div class="btn-group">
        <button class="hint-btn" onclick="useHint()">💡 Hint</button>
        <button class="skip-btn" onclick="skipQuestion()">Skip ⏭️</button>
      </div>
    </div>
  </div>

  <!-- Map Area -->
  <div class="map-wrapper" id="map-wrapper">
    <div id="toast"></div>
    <canvas id="fx-canvas"></canvas>
    <div id="map-canvas"></div>
    <div class="bottom-watermark">⚡ by RANJEET SINGH</div>

    <div class="zoom-controls">
      <button class="z-btn" onclick="zoomCenter(1.4)">+</button>
      <button class="z-btn" onclick="zoomCenter(0.7)">−</button>
      <button class="z-btn" onclick="resetZoom()">⟲</button>
    </div>
  </div>

  <!-- Win Modal -->
  <div class="overlay" id="end-overlay" style="display: none;">
    <div class="win-card">
      <div class="win-title">🎉 Champion!</div>
      <div class="win-score" id="final-score-text"></div>
      <div class="win-creator">👑 Game Developed By:<br><b style="font-size:16px; color:#fff;">RANJEET SINGH</b></div>
      <button class="action-btn btn-share" onclick="shareOnWhatsApp()">📲 Share Score on WhatsApp</button>
      <button class="action-btn btn-play" onclick="location.reload()">🔄 Play Again</button>
    </div>
  </div>

<script>
  let remainingStates = [];
  let currentTarget = null;
  let score = 0;
  let foundCount = 0;
  let totalCount = 0;
  let streak = 0;
  let hintTimer = null;

  /* =========================================================
     🎵 BUILT-IN WEB AUDIO SYNTHESIZER (SFX + BGM, Zero Lag) 🎵
     ========================================================= */
  let audioCtx = null;
  let soundEnabled = true;
  let bgmInterval = null;
  let bgmStep = 0;
  // Catchy Arcade Melody Notes (Hz)
  const melodyNotes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23];

  function unlockAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    if (soundEnabled && !bgmInterval) {
      startBGM();
    }
  }

  function playTone(freq, type, duration, vol = 0.12, delay = 0) {
    if (!soundEnabled || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);

    gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration);
  }

  function startBGM() {
    if (bgmInterval) clearInterval(bgmInterval);
    bgmInterval = setInterval(() => {
      if (!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
      const note = melodyNotes[bgmStep % melodyNotes.length];
      playTone(note, 'sine', 0.28, 0.025, 0);
      bgmStep++;
    }, 380);
  }

  function sfxCorrect() {
    unlockAudio();
    // Upward Winning Coin Chime
    playTone(523.25, 'triangle', 0.12, 0.18, 0);
    playTone(659.25, 'triangle', 0.12, 0.18, 0.08);
    playTone(783.99, 'triangle', 0.15, 0.18, 0.16);
    playTone(1046.50, 'sine', 0.30, 0.22, 0.24);
  }

  function sfxWrong() {
    unlockAudio();
    // Error Buzz + Mobile Vibrate
    playTone(170, 'sawtooth', 0.18, 0.16, 0);
    playTone(130, 'sawtooth', 0.25, 0.18, 0.14);
    if (navigator.vibrate) navigator.vibrate(120);
  }

  function sfxHint() {
    unlockAudio();
    playTone(600, 'sine', 0.1, 0.12, 0);
    playTone(900, 'sine', 0.2, 0.14, 0.09);
  }

  function sfxClick() {
    unlockAudio();
    playTone(420, 'sine', 0.07, 0.09, 0);
  }

  function sfxWinFanfare() {
    unlockAudio();
    const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
    notes.forEach((n, i) => playTone(n, 'triangle', 0.22, 0.2, i * 0.14));
  }

  function toggleAudio() {
    unlockAudio();
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('sound-toggle');
    if (soundEnabled) {
      btn.textContent = "🔊 Music";
      btn.style.borderColor = "#38bdf8";
      startBGM();
      sfxClick();
    } else {
      btn.textContent = "🔇 Mute";
      btn.style.borderColor = "#64748b";
      if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
    }
  }

  // Unlock audio on first touch anywhere
  window.addEventListener('pointerdown', () => unlockAudio(), { once: true });

  /* =========================================================
     🎆 CONFETTI & FLOATING SCORE POPUP ENGINE 🎆
     ========================================================= */
  const fxCanvas = document.getElementById('fx-canvas');
  const fxCtx = fxCanvas.getContext('2d');
  let particles = [];
  let animFrame = null;

  function resizeFxCanvas() {
    fxCanvas.width = mapWrapper.clientWidth;
    fxCanvas.height = mapWrapper.clientHeight;
  }
  window.addEventListener('resize', resizeFxCanvas);

  function burstConfetti(x, y) {
    resizeFxCanvas();
    const colors = ['#22c55e', '#fbbf24', '#38bdf8', '#f43f5e', '#a855f7', '#ffffff'];
    for (let i = 0; i < 24; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 5.5;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        size: 4 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 1
      });
    }
    if (!animFrame) updateParticles();
  }

  function updateParticles() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.22; // gravity
      p.life -= 0.028;
      fxCtx.globalAlpha = Math.max(0, p.life);
      fxCtx.fillStyle = p.color;
      fxCtx.fillRect(p.x, p.y, p.size, p.size);
    });
    particles = particles.filter(p => p.life > 0);
    if (particles.length > 0) {
      animFrame = requestAnimationFrame(updateParticles);
    } else {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      animFrame = null;
    }
  }

  function showScorePopup(x, y, text, color) {
    const pop = document.createElement('div');
    pop.className = 'pop-score';
    pop.textContent = text;
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
    pop.style.color = color;
    mapWrapper.appendChild(pop);
    setTimeout(() => pop.remove(), 750);
  }

  /* =========================================================
     🚀 60FPS MATRIX TRANSFORM & MAP ENGINE 🚀
     ========================================================= */
  let scale = 1, tx = 0, ty = 0;
  let isDragging = false, startX = 0, startY = 0, moved = false;
  let pinchDist = 0, startScale = 1, pinchMidX = 0, pinchMidY = 0;

  const mapCanvas = document.getElementById('map-canvas');
  const mapWrapper = document.getElementById('map-wrapper');

  function renderTransform() {
    mapCanvas.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
  }

  function clampPan() {
    if (scale <= 1.02) {
      scale = 1; tx = 0; ty = 0;
      return;
    }
    const rect = mapWrapper.getBoundingClientRect();
    const maxW = rect.width * (scale - 1);
    const maxH = rect.height * (scale - 1);
    tx = Math.min(rect.width * 0.25, Math.max(-maxW - rect.width * 0.25, tx));
    ty = Math.min(rect.height * 0.25, Math.max(-maxH - rect.height * 0.25, ty));
  }

  function zoomAtPoint(newScale, cx, cy) {
    newScale = Math.min(Math.max(1, newScale), 7);
    const ratio = newScale / scale;
    tx = cx - (cx - tx) * ratio;
    ty = cy - (cy - ty) * ratio;
    scale = newScale;
    clampPan();
    renderTransform();
  }

  function zoomCenter(factor) {
    sfxClick();
    const rect = mapWrapper.getBoundingClientRect();
    zoomAtPoint(scale * factor, rect.width / 2, rect.height / 2);
  }

  function resetZoom() {
    sfxClick();
    scale = 1; tx = 0; ty = 0;
    renderTransform();
  }

  mapWrapper.addEventListener('touchstart', (e) => {
    if (e.target.closest('.zoom-controls')) return;
    if (e.touches.length === 1) {
      isDragging = true;
      moved = false;
      startX = e.touches[0].clientX - tx;
      startY = e.touches[0].clientY - ty;
    } else if (e.touches.length === 2) {
      isDragging = false;
      moved = true;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist = Math.hypot(dx, dy);
      startScale = scale;
      const rect = mapWrapper.getBoundingClientRect();
      pinchMidX = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
      pinchMidY = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
    }
  }, { passive: true });

  mapWrapper.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && isDragging) {
      const nx = e.touches[0].clientX - startX;
      const ny = e.touches[0].clientY - startY;
      if (Math.hypot(nx - tx, ny - ty) > 5) moved = true;
      if (scale > 1) {
        tx = nx;
        ty = ny;
        clampPan();
        mapCanvas.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
      }
    } else if (e.touches.length === 2 && pinchDist > 0) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      zoomAtPoint(startScale * (dist / pinchDist), pinchMidX, pinchMidY);
    }
  }, { passive: true });

  window.addEventListener('touchend', () => {
    isDragging = false;
    pinchDist = 0;
  });

  let toastTimer = null;
  function showToast(msg, color) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderColor = color;
    t.style.opacity = "1";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.opacity = "0"; }, 1200);
  }

  // Official Updated Map Sources (J&K and Ladakh Separate + Accurate Boundaries)
  const mapSources = [
    "https://gist.githubusercontent.com/jbrobst/56c13bbbf9d97d187fea01ca62ea5112/raw/e388c4cae20aa53cb5090210a42ebb9b765c0a36/india_states.geojson",
    "https://raw.githubusercontent.com/Subhash9325/GeoJson-Data-of-Indian-States/master/Indian_States"
  ];

  // Clear Tap Dots for Small Union Territories
  const utDots = [
    { name: "Chandigarh", lon: 76.78, lat: 30.73 },
    { name: "Delhi", lon: 77.10, lat: 28.65 },
    { name: "Puducherry", lon: 79.81, lat: 11.94 },
    { name: "Lakshadweep", lon: 72.64, lat: 10.57 },
    { name: "Dadra and Nagar Haveli and Daman and Diu", lon: 72.84, lat: 20.40 }
  ];

  function project(lon, lat) {
