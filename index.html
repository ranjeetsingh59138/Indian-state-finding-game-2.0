<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>INDIA MAP PRO - By Ranjeet Singh</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background-color: #060a12;
    color: #f8fafc;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 👑 TOP VIP CREATOR BANNER 👑 */
  .creator-top-banner {
    background: linear-gradient(90deg, #b45309, #fbbf24, #b45309);
    color: #000;
    text-align: center;
    padding: 6px 10px;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 50;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid #fef08a;
  }
  .creator-top-banner span {
    background: #060a12;
    color: #fbbf24;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1px;
  }

  /* Header Panel */
  .header-panel {
    background: #0f172a;
    padding: 8px 12px;
    border-bottom: 1px solid #1e293b;
    z-index: 20;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .title-area {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .game-title {
    font-size: 15px;
    font-weight: 900;
    color: #38bdf8;
    letter-spacing: 0.5px;
  }
  .sound-btn {
    background: #1e293b;
    border: 1px solid #38bdf8;
    color: #f8fafc;
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }
  .stats-row {
    display: flex;
    gap: 5px;
  }
  .stat-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 2px 8px;
    text-align: center;
    min-width: 56px;
  }
  .stat-label {
    font-size: 8px;
    color: #94a3b8;
    text-transform: uppercase;
  }
  .stat-val {
    font-size: 13px;
    font-weight: 800;
    color: #4ade80;
  }
  .streak-val {
    color: #fb923c;
  }

  /* Target Box */
  .target-box {
    background: #172554;
    border: 1.5px solid #38bdf8;
    border-radius: 10px;
    padding: 7px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .target-info {
    flex: 1;
    min-width: 0;
  }
  .target-sub {
    font-size: 9px;
    color: #93c5fd;
    text-transform: uppercase;
    font-weight: 700;
  }
  .target-state {
    font-size: 17px;
    font-weight: 900;
    color: #fbbf24;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .btn-group {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .hint-btn {
    background: #f59e0b;
    border: 1px solid #fde047;
    color: #000;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }
  .skip-btn {
    background: #1e3a8a;
    border: 1px solid #60a5fa;
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .hint-btn:active, .skip-btn:active, .sound-btn:active {
    transform: scale(0.94);
  }

  /* Map Container - Pure 60FPS GPU Layer */
  .map-wrapper {
    flex: 1;
    position: relative;
    background: radial-gradient(circle at center, #0f172a 0%, #060a12 100%);
    overflow: hidden;
    touch-action: none;
  }
  #map-canvas {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-origin: 0 0;
    will-change: transform;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  svg {
    width: 96%;
    height: 96%;
    max-width: 650px;
    max-height: 750px;
    shape-rendering: geometricPrecision;
  }
  svg path {
    fill: #1e293b;
    stroke: #94a3b8;
    stroke-width: 0.85px;
    stroke-linejoin: round;
    cursor: pointer;
  }
  svg path.correct {
    fill: #16a34a !important;
    stroke: #ffffff !important;
    stroke-width: 1.1px !important;
    pointer-events: none;
  }
  svg path.wrong {
    fill: #dc2626 !important;
  }
  svg path.hint-glow {
    fill: #facc15 !important;
    stroke: #ffffff !important;
    stroke-width: 1.4px !important;
  }

  /* Small UT & Special Region Dots */
  svg circle.ut-dot {
    fill: #38bdf8;
    stroke: #ffffff;
    stroke-width: 1.2px;
    cursor: pointer;
  }
  svg circle.ut-dot.correct {
    fill: #22c55e !important;
    stroke: #ffffff !important;
    pointer-events: none;
  }
  svg circle.ut-dot.wrong {
    fill: #ef4444 !important;
  }
  svg circle.ut-dot.hint-glow {
    fill: #facc15 !important;
    stroke: #ff0000 !important;
    stroke-width: 2px !important;
    r: 10px !important;
  }

  /* Floating Score Popup */
  .pop-score {
    position: absolute;
    font-weight: 900;
    font-size: 18px;
    pointer-events: none;
    z-index: 40;
    animation: floatUp 0.7s ease-out forwards;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
    50% { transform: translate(-50%, -20px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -38px) scale(1); }
  }

  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 35;
  }

  /* Bottom Watermark */
  .bottom-watermark {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: #0f172a;
    border: 1.5px solid #fbbf24;
    color: #fbbf24;
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 800;
    pointer-events: none;
    z-index: 15;
  }

  /* Zoom Controls */
  .zoom-controls {
    position: absolute;
    bottom: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 15;
  }
  .z-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: #1e293b;
    border: 1px solid #475569;
    color: #f8fafc;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .z-btn:active {
    background: #38bdf8;
    color: #000;
  }

  /* Toast Notification */
  #toast {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: #0f172a;
    border: 1.5px solid #38bdf8;
    color: #fff;
    padding: 6px 14px;
    border-radius: 18px;
    font-size: 12px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s;
    z-index: 30;
    white-space: nowrap;
  }

  /* Win Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 10, 18, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
    text-align: center;
  }
  .win-card {
    background: #1e293b;
    border: 2px solid #fbbf24;
    border-radius: 20px;
    padding: 24px 20px;
    max-width: 330px;
    width: 100%;
  }
  .win-title {
    font-size: 24px;
    font-weight: 900;
    color: #fbbf24;
    margin-bottom: 8px;
  }
  .win-score {
    font-size: 16px;
    color: #e2e8f0;
    margin-bottom: 14px;
  }
  .win-creator {
    background: #0f172a;
    border: 1px solid #fbbf24;
    color: #fde047;
    padding: 8px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 16px;
  }
  .action-btn {
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .btn-play { background: #38bdf8; color: #000; }
  .btn-share { background: #22c55e; color: #fff; }
</style>
</head>
<body>

  <!-- 👑 SABSE UPAR AAPKA NAAM 👑 -->
  <div class="creator-top-banner">
    👑 CREATED BY: <span>RANJEET SINGH</span>
  </div>

  <!-- Header -->
  <div class="header-panel">
    <div class="top-row">
      <div class="title-area">
        <div class="game-title">🇮🇳 INDIA MAP PRO</div>
        <button class="sound-btn" id="sound-toggle" onclick="toggleAudio()">🔊 Music</button>
      </div>
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Streak</div>
          <div class="stat-val streak-val" id="streak-val">🔥0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Found</div>
          <div class="stat-val" id="found-val">0/36</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Score</div>
          <div class="stat-val" id="score-val">0</div>
        </div>
      </div>
    </div>

    <div class="target-box">
      <div class="target-info">
        <div class="target-sub">🗺️ TAP ON THIS STATE / UT:</div>
        <div class="target-state" id="target-name">Starting Game...</div>
      </div>
      <div class="btn-group">
        <button class="hint-btn" onclick="useHint()">💡 Hint</button>
        <button class="skip-btn" onclick="skipQuestion()">Skip ⏭️</button>
      </div>
    </div>
  </div>

  <!-- Map Area -->
  <div class="map-wrapper" id="map-wrapper">
    <div id="toast"></div>
    <canvas id="fx-canvas"></canvas>
    <div id="map-canvas"></div>
    <div class="bottom-watermark">⚡ by RANJEET SINGH</div>

    <div class="zoom-controls">
      <button class="z-btn" onclick="zoomCenter(1.4)">+</button>
      <button class="z-btn" onclick="zoomCenter(0.7)">−</button>
      <button class="z-btn" onclick="resetZoom()">⟲</button>
    </div>
  </div>

  <!-- Win Modal -->
  <div class="overlay" id="end-overlay" style="display: none;">
    <div class="win-card">
      <div class="win-title">🎉 Champion!</div>
      <div class="win-score" id="final-score-text"></div>
      <div class="win-creator">👑 Game Developed By:<br><b style="font-size:16px; color:#fff;">RANJEET SINGH</b></div>
      <button class="action-btn btn-share" onclick="shareOnWhatsApp()">📲 Share Score on WhatsApp</button>
      <button class="action-btn btn-play" onclick="location.reload()">🔄 Play Again</button>
    </div>
  </div>

<script>
  let remainingStates = [];
  let currentTarget = null;
  let score = 0;
  let foundCount = 0;
  let totalCount = 0;
  let streak = 0;
  let hintTimer = null;

  /* =========================================================
     🎵 WEB AUDIO SYNTHESIZER (SFX + BGM, Zero Lag) 🎵
     ========================================================= */
  let audioCtx = null;
  let soundEnabled = true;
  let bgmInterval = null;
  let bgmStep = 0;
  const melodyNotes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23];

  function unlockAudio() {
    try {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (soundEnabled && !bgmInterval) startBGM();
    } catch (e) {}
  }

  function playTone(freq, type, duration, vol = 0.12, delay = 0) {
    if (!soundEnabled || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    } catch (e) {}
  }

  function startBGM() {
    if (bgmInterval) clearInterval(bgmInterval);
    bgmInterval = setInterval(() => {
      if (!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
      const note = melodyNotes[bgmStep % melodyNotes.length];
      playTone(note, 'sine', 0.25, 0.022, 0);
      bgmStep++;
    }, 380);
  }

  function sfxCorrect() {
    unlockAudio();
    playTone(523.25, 'triangle', 0.11, 0.18, 0);
    playTone(659.25, 'triangle', 0.11, 0.18, 0.08);
    playTone(783.99, 'triangle', 0.14, 0.18, 0.16);
    playTone(1046.50, 'sine', 0.28, 0.22, 0.24);
  }

  function sfxWrong() {
    unlockAudio();
    playTone(165, 'sawtooth', 0.16, 0.15, 0);
    playTone(125, 'sawtooth', 0.22, 0.17, 0.13);
    if (navigator.vibrate) navigator.vibrate(100);
  }

  function sfxHint() {
    unlockAudio();
    playTone(580, 'sine', 0.1, 0.12, 0);
    playTone(880, 'sine', 0.18, 0.14, 0.09);
  }

  function sfxClick() {
    unlockAudio();
    playTone(420, 'sine', 0.06, 0.08, 0);
  }

  function sfxWinFanfare() {
    unlockAudio();
    [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50].forEach((n, i) =>
      playTone(n, 'triangle', 0.22, 0.2, i * 0.14)
    );
  }

  function toggleAudio() {
    unlockAudio();
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('sound-toggle');
    if (soundEnabled) {
      btn.textContent = "🔊 Music";
      btn.style.borderColor = "#38bdf8";
      startBGM();
      sfxClick();
    } else {
      btn.textContent = "🔇 Mute";
      btn.style.borderColor = "#64748b";
      if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
    }
  }

  window.addEventListener('pointerdown', () => unlockAudio(), { once: true });

  /* =========================================================
     🎆 CONFETTI & POPUP ENGINE 🎆
     ========================================================= */
  const fxCanvas = document.getElementById('fx-canvas');
  const fxCtx = fxCanvas.getContext('2d');
  let particles = [];
  let animFrame = null;

  function resizeFxCanvas() {
    fxCanvas.width = mapWrapper.clientWidth;
    fxCanvas.height = mapWrapper.clientHeight;
  }
  window.addEventListener('resize', resizeFxCanvas);

  function burstConfetti(x, y) {
    resizeFxCanvas();
    const colors = ['#22c55e', '#fbbf24', '#38bdf8', '#f43f5e', '#a855f7', '#ffffff'];
    for (let i = 0; i < 20; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 5;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        size: 4 + Math.random() * 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 1
      });
    }
    if (!animFrame) updateParticles();
  }

  function updateParticles() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.24;
      p.life -= 0.032;
      fxCtx.globalAlpha = Math.max(0, p.life);
      fxCtx.fillStyle = p.color;
      fxCtx.fillRect(p.x, p.y, p.size, p.size);
    });
    particles = particles.filter(p => p.life > 0);
    if (particles.length > 0) {
      animFrame = requestAnimationFrame(updateParticles);
    } else {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      animFrame = null;
    }
  }

  function showScorePopup(x, y, text, color) {
    const pop = document.createElement('div');
    pop.className = 'pop-score';
    pop.textContent = text;
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
    pop.style.color = color;
    mapWrapper.appendChild(pop);
    setTimeout(() => pop.remove(), 700);
  }

  /* =========================================================
     🚀 60FPS HARDWARE ACCELERATED ZOOM & PAN 🚀
     ========================================================= */
  let scale = 1, tx = 0, ty = 0;
  let isDragging = false, startX = 0, startY = 0, moved = false;
  let pinchDist = 0, startScale = 1, pinchMidX = 0, pinchMidY = 0;

  const mapCanvas = document.getElementById('map-canvas');
  const mapWrapper = document.getElementById('map-wrapper');

  function renderTransform() {
    mapCanvas.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
  }

  function clampPan() {
    if (scale <= 1.02) {
      scale = 1; tx = 0; ty = 0;
      return;
    }
    const rect = mapWrapper.getBoundingClientRect();
    const maxW = rect.width * (scale - 1);
    const maxH = rect.height * (scale - 1);
    tx = Math.min(rect.width * 0.25, Math.max(-maxW - rect.width * 0.25, tx));
    ty = Math.min(rect.height * 0.25, Math.max(-maxH - rect.height * 0.25, ty));
  }

  function zoomAtPoint(newScale, cx, cy) {
    newScale = Math.min(Math.max(1, newScale), 7);
    const ratio = newScale / scale;
    tx = cx - (cx - tx) * ratio;
    ty = cy - (cy - ty) * ratio;
    scale = newScale;
    clampPan();
    renderTransform();
  }

  function zoomCenter(factor) {
    sfxClick();
    const rect = mapWrapper.getBoundingClientRect();
    zoomAtPoint(scale * factor, rect.width / 2, rect.height / 2);
  }

  function resetZoom() {
    sfxClick();
    scale = 1; tx = 0; ty = 0;
    renderTransform();
  }

  mapWrapper.addEventListener('touchstart', (e) => {
    if (e.target.closest('.zoom-controls')) return;
    if (e.touches.length === 1) {
      isDragging = true;
      moved = false;
      startX = e.touches[0].clientX - tx;
      startY = e.touches[0].clientY - ty;
    } else if (e.touches.length === 2) {
      isDragging = false;
      moved = true;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist = Math.hypot(dx, dy);
      startScale = scale;
      const rect = mapWrapper.getBoundingClientRect();
      pinchMidX = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
      pinchMidY = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
    }
  }, { passive: true });

  mapWrapper.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && isDragging) {
      const nx = e.touches[0].clientX - startX;
      const ny = e.touches[0].clientY - startY;
      if (Math.hypot(nx - tx, ny - ty) > 5) moved = true;
      if (scale > 1) {
        tx = nx;
        ty = ny;
        clampPan();
        renderTransform();
      }
    } else if (e.touches.length === 2 && pinchDist > 0) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      zoomAtPoint(startScale * (dist / pinchDist), pinchMidX, pinchMidY);
    }
  }, { passive: true });

  window.addEventListener('touchend', () => {
    isDragging = false;
    pinchDist = 0;
  });

  let toastTimer = null;
  function showToast(msg, color) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderColor = color;
    t.style.opacity = "1";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.opacity = "0"; }, 1200);
  }

  /* =========================================================
     🗺️ ULTRA-FAST RELIABLE INDIA SVG + J&K / LADAKH SPLIT 🗺️
     ========================================================= */
  const fastSvgUrls = [
    "https://cdn.jsdelivr.net/npm/@svg-maps/india@1.0.1/india.svg",
    "https://unpkg.com/@svg-maps/india@1.0.1/india.svg",
    "https://cdn.jsdelivr.net/gh/svg-maps/india@master/india.svg"
  ];

  async function fetchWithTimeout(url, ms = 3500) {
    const ctrl = new AbortController();
    const id = setTimeout(() => ctrl.abort(), ms);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(id);
      return res;
    } catch (e) {
      clearTimeout(id);
      throw e;
    }
  }

  async function initMap() {
    for (const url of fastSvgUrls) {
      try {
        const res = await fetchWithTimeout(url, 3500);
        if (res.ok) {
          const svgText = await res.text();
          if (svgText.includes("<svg")) {
            mapCanvas.innerHTML = svgText;
            enhanceMapWithLadakhSplit();
            return;
          }
        }
      } catch (err) {}
    }
    document.getElementById('target-name').textContent = "Tap Skip or Reload Page";
  }

  function enhanceMapWithLadakhSplit() {
    const svg = mapCanvas.querySelector('svg');
    if (!svg) return;
    const svgNS = "http://www.w3.org/2000/svg";

    // Create crisp SVG clipPaths to split J&K (West) and Ladakh (North-East) accurately
    const jkPath = svg.querySelector('#in-jk, [name="Jammu and Kashmir"]');
    const stateSet = new Set();
    const stateMap = new Map();

    function registerElement(name, elem) {
      stateSet.add(name);
      if (!stateMap.has(name)) stateMap.set(name, []);
      stateMap.get(name).push(elem);
      elem.addEventListener('click', (e) => {
        if (moved) return;
        e.stopPropagation();
        checkAnswer(name, e);
      });
    }

    if (jkPath) {
      const dOrig = jkPath.getAttribute('d');
      const bbox = jkPath.getBBox();
      const splitX = bbox.x + bbox.width * 0.44;
      const splitY = bbox.y + bbox.height * 0.42;

      const defs = document.createElementNS(svgNS, "defs");

      // Clip for Jammu & Kashmir (South-West half)
      const clipJK = document.createElementNS(svgNS, "clipPath");
      clipJK.setAttribute("id", "clip-jk");
      const polyJK = document.createElementNS(svgNS, "polygon");
      polyJK.setAttribute("points", `${bbox.x - 10},${splitY - 12} ${splitX},${splitY - 12} ${splitX + 10},${bbox.y + bbox.height + 10} ${bbox.x - 10},${bbox.y + bbox.height + 10}`);
      clipJK.appendChild(polyJK);

      // Clip for Ladakh (North & East half)
      const clipLA = document.createElementNS(svgNS, "clipPath");
      clipLA.setAttribute("id", "clip-la");
      const polyLA = document.createElementNS(svgNS, "polygon");
      polyLA.setAttribute("points", `${bbox.x - 10},${bbox.y - 10} ${bbox.x + bbox.width + 20},${bbox.y - 10} ${bbox.x + bbox.width + 20},${bbox.y + bbox.height + 10} ${splitX + 10},${bbox.y + bbox.height + 10} ${splitX},${splitY - 12} ${bbox.x - 10},${splitY - 12}`);
      clipLA.appendChild(polyLA);

      defs.appendChild(clipJK);
      defs.appendChild(clipLA);
      svg.insertBefore(defs, svg.firstChild);

      // Create Ladakh Path
      const ladakhPath = document.createElementNS(svgNS, "path");
      ladakhPath.setAttribute("d", dOrig);
      ladakhPath.setAttribute("clip-path", "url(#clip-la)");
      jkPath.parentNode.insertBefore(ladakhPath, jkPath.nextSibling);

      // Clip J&K Path
      jkPath.setAttribute("clip-path", "url(#clip-jk)");

      // Draw crisp border line between J&K and Ladakh
      const borderLine = document.createElementNS(svgNS, "polyline");
      borderLine.setAttribute("points", `${bbox.x + 14},${splitY - 10} ${splitX},${splitY - 10} ${splitX + 8},${bbox.y + bbox.height - 6}`);
      borderLine.setAttribute("fill", "none");
      borderLine.setAttribute("stroke", "#cbd5e1");
      borderLine.setAttribute("stroke-width", "1.1");
      borderLine.setAttribute("pointer-events", "none");
      jkPath.parentNode.insertBefore(borderLine, ladakhPath.nextSibling);

      registerElement("Jammu and Kashmir", jkPath);
      registerElement("Ladakh", ladakhPath);
    }

    // Register all other States & UTs
    const allPaths = svg.querySelectorAll('path');
    allPaths.forEach((p) => {
      if (p === jkPath || p.getAttribute('clip-path') === 'url(#clip-la)') return;
      let name = p.getAttribute('name') || p.getAttribute('title') || p.id;
      if (!name) return;

      if (name.includes("Dadra") || name.includes("Daman")) {
        name = "Dadra and Nagar Haveli and Daman and Diu";
      }
      if (name === "Orissa") name = "Odisha";
      if (name === "Uttaranchal") name = "Uttarakhand";

      registerElement(name, p);

      // Add easy-tap dot for tiny UTs so mobile players can tap effortlessly
      const tinyUTs = ["Chandigarh", "Delhi", "Puducherry", "Lakshadweep", "Dadra and Nagar Haveli and Daman and Diu"];
      if (tinyUTs.includes(name)) {
        try {
          const b = p.getBBox();
          if (b.width < 18 && b.height < 18) {
            const dot = document.createElementNS(svgNS, "circle");
            dot.setAttribute("cx", (b.x + b.width / 2).toFixed(1));
            dot.setAttribute("cy", (b.y + b.height / 2).toFixed(1));
            dot.setAttribute("r", "5.5");
            dot.setAttribute("class", "ut-dot");
            svg.appendChild(dot);
            stateMap.get(name).push(dot);
            dot.addEventListener('click', (e) => {
              if (moved) return;
              e.stopPropagation();
              checkAnswer(name, e);
            });
          }
        } catch (e) {}
      }
    });

    window.stateMap = stateMap;
    remainingStates = Array.from(stateSet);
    totalCount = remainingStates.length;
    updateUI();
    nextQuestion();
  }

  function useHint() {
    if (!currentTarget || !window.stateMap) return;
    const elems = window.stateMap.get(currentTarget) || [];
    if (elems.length === 0) return;

    sfxHint();
    score = Math.max(0, score - 3);
    streak = 0;
    updateUI();
    showToast(`💡 Hint: Look at the Yellow Highlight! (-3)`, "#facc15");

    clearTimeout(hintTimer);
    let blinks = 0;
    function blinkState() {
      const isGlowing = blinks % 2 === 0;
      elems.forEach(el => {
        if (isGlowing) el.classList.add('hint-glow');
        else el.classList.remove('hint-glow');
      });
      blinks++;
      if (blinks < 6) {
        hintTimer = setTimeout(blinkState, 260);
      } else {
        elems.forEach(el => el.classList.remove('hint-glow'));
      }
    }
    blinkState();
  }

  function skipQuestion() {
    sfxClick();
    streak = 0;
    updateUI();
    nextQuestion();
  }

  function clearAllHints() {
    clearTimeout(hintTimer);
    const glowing = mapCanvas.querySelectorAll('.hint-glow');
    glowing.forEach(el => el.classList.remove('hint-glow'));
  }

  function checkAnswer(selectedName, evt) {
    if (!currentTarget) return;
    const elems = window.stateMap.get(selectedName) || [];
    if (elems[0] && elems[0].classList.contains('correct')) return;

    const rect = mapWrapper.getBoundingClientRect();
    const clickX = evt ? (evt.clientX - rect.left) : (rect.width / 2);
    const clickY = evt ? (evt.clientY - rect.top) : (rect.height / 2);

    if (selectedName === currentTarget) {
      clearAllHints();
      sfxCorrect();
      elems.forEach(el => el.classList.add('correct'));
      streak++;
      const bonus = streak > 1 ? (streak - 1) * 2 : 0;
      const pointsEarned = 10 + bonus;
      score += pointsEarned;
      foundCount++;

      burstConfetti(clickX, clickY);
      showScorePopup(clickX, clickY, streak > 1 ? `+${pointsEarned} 🔥` : `+10`, "#4ade80");

      remainingStates = remainingStates.filter(s => s !== currentTarget);
      showToast(streak > 1 ? `🔥 ${streak}x Streak! ${selectedName} (+${pointsEarned})` : `✅ Correct! ${selectedName} (+10)`, "#22c55e");
      updateUI();
      nextQuestion();
    } else {
      sfxWrong();
      elems.forEach(el => el.classList.add('wrong'));
      streak = 0;
      score = Math.max(0, score - 2);
      showScorePopup(clickX, clickY, `-2 ❌`, "#f87171");
      showToast(`❌ That is ${selectedName} (-2)`, "#ef4444");
      updateUI();
      setTimeout(() => {
        elems.forEach(el => el.classList.remove('wrong'));
      }, 400);
    }
  }

  function nextQuestion() {
    clearAllHints();
    if (remainingStates.length === 0) {
      sfxWinFanfare();
      burstConfetti(mapWrapper.clientWidth / 2, mapWrapper.clientHeight / 2);
      document.getElementById('final-score-text').textContent = `Score: ${score} | Found: ${foundCount}/${totalCount}`;
      document.getElementById('end-overlay').style.display = 'flex';
      return;
    }
    const r = Math.floor(Math.random() * remainingStates.length);
    currentTarget = remainingStates[r];
    document.getElementById('target-name').textContent = currentTarget;
  }

  function updateUI() {
    document.getElementById('found-val').textContent = `${foundCount}/${totalCount}`;
    document.getElementById('score-val').textContent = score;
    document.getElementById('streak-val').textContent = `🔥${streak}`;
  }

  function shareOnWhatsApp() {
    const msg = `🇮🇳 *INDIA MAP PRO (By RANJEET SINGH)* 🗺️\n\nMaine is game mein *${score} Score* banaya (${foundCount}/${totalCount} States)! Kya aap mujhe hara sakte hain?\n\n👇 *Abhi khelne ke liye link par click karein:*\n${window.location.href}`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
  }

  initMap();
</script>
